<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>إدارة التطبيق | اندرويد 2</title>

  <!-- إعدادات تطبيق الويب PWA -->
  <link rel="manifest" href="admin-manifest.json">
  <link rel="apple-touch-icon" href="https://res.cloudinary.com/dvzg70krq/image/upload/v1789378700/file_00000000110081fbad6ea464dc721a58_hzasvk.png">
  <meta name="theme-color" content="#121216">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --primary: #b91530; 
      --primary-hover: #810a1e;
      --bg: #121216;
      --card-bg: #1e1e24;
      --input-bg: #26262e;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #32323a;
      --danger: #ef4444; 
      --danger-hover: #dc2626;
      --success: #4ade80;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); padding: 12px; display: flex; justify-content: center; min-height: 100vh; }
    .container { width: 100%; max-width: 500px; }

    /* شاشة القفل / الدخول */
    #lockScreen {
      position: fixed; inset: 0; background: var(--bg); z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;
    }
    .lock-card {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px;
      padding: 30px 20px; width: 100%; max-width: 360px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    .lock-logo {
      width: 65px; height: 65px; border-radius: 14px; border: 1px solid var(--primary);
      margin-bottom: 12px; object-fit: cover; background: #fff; padding: 3px;
    }
    .input-box {
      width: 100%; padding: 12px; text-align: right; font-size: 1rem;
      background: var(--input-bg); border: 1px solid var(--border); border-radius: 8px; color: #fff;
      outline: none; margin-bottom: 12px;
    }
    .input-box:focus { border-color: var(--primary); }

    /* الشريط العلوي */
    .header-bar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid var(--border);
    }
    .header-title {
      display: flex; align-items: center; gap: 8px; font-family: 'Cairo', sans-serif;
      font-weight: 800; color: #fff; font-size: 1.1rem;
    }
    .header-logo { width: 32px; height: 32px; border-radius: 6px; border: 1px solid var(--primary); background: #fff; }
    .btn-logout { background: transparent; border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 6px; font-size: 0.82rem; font-weight: bold; cursor: pointer; }

    /* التبويبات الرئيسية */
    .tabs { display: flex; gap: 8px; margin-bottom: 15px; }
    .tab-btn {
      flex: 1; padding: 12px; background: var(--card-bg); border: 1px solid var(--border);
      color: var(--muted); font-family: 'Cairo', sans-serif; font-weight: 700; font-size: 0.95rem;
      border-radius: 8px; cursor: pointer; transition: 0.2s; text-align: center;
    }
    .tab-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    .card { background: var(--card-bg); border-radius: 12px; padding: 16px; border: 1px solid var(--border); }
    
    /* أزرار الحالة (إضافة / تعديل) */
    .sub-mode { display: flex; gap: 8px; margin-bottom: 15px; background: #16161a; padding: 4px; border-radius: 8px; }
    .sub-mode button {
      flex: 1; padding: 8px; border: none; background: transparent; color: #aaa;
      border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 700;
    }
    .sub-mode button.active { background: var(--border); color: #fff; }

    .form-group { margin-bottom: 12px; position: relative; }
    label { display: block; font-size: 0.82rem; color: #bbb; margin-bottom: 5px; font-weight: 600; }
    input, select, textarea {
      width: 100%; padding: 10px 12px; background: var(--input-bg); border: 1px solid var(--border);
      border-radius: 8px; color: #fff; font-size: 0.95rem; outline: none; font-family: inherit;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); }
    textarea { resize: vertical; min-height: 80px; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .upload-box {
      border: 1px dashed var(--muted); padding: 12px; text-align: center;
      border-radius: 8px; cursor: pointer; color: var(--text); font-size: 0.88rem; display: block; font-weight: bold; background: var(--input-bg);
    }
    .img-preview { width: 100%; max-height: 150px; object-fit: contain; border-radius: 8px; margin-top: 8px; display: none; background: #000; }

    /* أزرار التحكم (حفظ وحذف) */
    .action-buttons { display: flex; gap: 10px; margin-top: 20px; }
    .submit-btn {
      flex: 2; padding: 13px; background: var(--primary); color: #fff; border: none;
      border-radius: 8px; font-family: 'Cairo', sans-serif; font-weight: 800; font-size: 1rem;
      cursor: pointer; transition: 0.2s;
    }
    .delete-btn {
      flex: 1; padding: 13px; background: var(--danger); color: #fff; border: none;
      border-radius: 8px; font-family: 'Cairo', sans-serif; font-weight: 800; font-size: 0.9rem;
      cursor: pointer; transition: 0.2s;
    }
    .submit-btn:hover { background: var(--primary-hover); }
    .delete-btn:hover { background: var(--danger-hover); }
    
    .submit-btn:disabled, .delete-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .status { text-align: center; margin-top: 10px; font-size: 0.88rem; font-weight: bold; }
    .hidden { display: none !important; }

    /* تنسيقات النسخ المتغيرة */
    .variant-block {
      background: #1a1a20; padding: 12px; border-radius: 8px; 
      border: 1px solid #32323a; position: relative; margin-bottom: 10px;
    }
    .variant-del-btn {
      position: absolute; top: 8px; left: 8px; background: var(--danger); 
      color: white; border: none; border-radius: 4px; padding: 4px 8px; 
      cursor: pointer; font-size: 0.75rem;
    }
    .variant-add-btn {
      margin-top: 10px; padding: 10px; background: var(--input-bg); 
      border: 1px dashed var(--muted); color: #fff; border-radius: 8px; 
      cursor: pointer; width: 100%; font-family: 'Cairo', sans-serif; font-weight: 700;
    }
  </style>
</head>
<body>

<!-- شاشة الدخول (إيميل وباسوورد) -->
<div id="lockScreen">
  <div class="lock-card">
    <img class="lock-logo" src="https://res.cloudinary.com/dvzg70krq/image/upload/v1789378700/file_00000000110081fbad6ea464dc721a58_hzasvk.png" alt="شعار الإدارة">
    <h3 style="font-family:'Cairo'; font-weight:800; color: #fff; margin-bottom: 4px;">إدارة اندرويد 2</h3>
    <p style="font-size: 0.82rem; color: var(--muted); margin-bottom: 20px;">تسجيل الدخول الآمن</p>
    <form onsubmit="handleLogin(event)">
      <input type="email" id="loginEmail" class="input-box" placeholder="البريد الإلكتروني" required>
      <input type="password" id="loginPassword" class="input-box" placeholder="كلمة المرور" required>
      <button type="submit" id="loginBtn" class="submit-btn" style="width:100%;">دخول</button>
    </form>
    <div id="loginError" style="color: var(--danger); font-size: 0.85rem; margin-top: 10px; font-weight: bold;"></div>
  </div>
</div>

<!-- لوحة التحكم -->
<div class="container hidden" id="adminContent">
  <div class="header-bar">
    <div class="header-title">
      <img class="header-logo" src="https://res.cloudinary.com/dvzg70krq/image/upload/v1789378700/file_00000000110081fbad6ea464dc721a58_hzasvk.png" alt="أيقونة">
      <span>إدارة متجر اندرويد 2</span>
    </div>
    <button class="btn-logout" onclick="logout()">خروج 🚪</button>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchMainTab('devices')">📱 الأجهزة والاكسسوارات</button>
    <button class="tab-btn" onclick="switchMainTab('offers')">🔥 عروض السلايدر</button>
  </div>

  <!-- قسم الأجهزة -->
  <div id="devicesSection" class="card">
    <div class="sub-mode">
      <button id="dModeAdd" class="active" onclick="setDeviceMode('add')">➕ إضافة جديد</button>
      <button id="dModeEdit" onclick="setDeviceMode('edit')">✏️ تعديل / حذف</button>
    </div>

    <form id="deviceForm" onsubmit="saveDevice(event)">
      <!-- مجموعة اختيار الجهاز للتعديل مع مربع البحث -->
      <div id="selectDeviceGroup" class="form-group hidden" style="background: var(--input-bg); padding: 10px; border-radius: 8px; border: 1px solid var(--border);">
        <label>ابحث واختر الجهاز:</label>
        <input type="text" id="searchEditDevice" placeholder="🔍 اكتب للبحث السريع (مثال: iPhone)..." class="input-box" style="margin-bottom:8px;" onkeyup="filterEditDevices()">
        <select id="editDeviceSelect" onchange="loadDeviceData()">
          <option value="">-- جاري التحميل... --</option>
        </select>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label>الماركة / التصنيف *</label>
          <input type="text" id="fBrand" required placeholder="مثال: آبل، شاومي، شواحن...">
        </div>
        <div class="form-group">
          <label>الموديل / الاسم *</label>
          <input type="text" id="fModel" required placeholder="مثال: iPhone 14">
        </div>
      </div>
      
      <div class="grid-2">
        <div class="form-group">
          <label>الحالة</label>
          <select id="fCondition">
            <option value="جديد">جديد</option>
            <option value="مستعمل">مستعمل</option>
          </select>
        </div>
        <div class="form-group">
          <label>السعر الأساسي ($) *</label>
          <input type="number" id="fPrice" required placeholder="0">
        </div>
      </div>

      <div class="form-group">
        <label>اللون الافتراضي (اختياري)</label>
        <input type="text" id="fColor" placeholder="أسود، أبيض...">
      </div>

      <div class="form-group">
        <label>المواصفات المختصرة الافتراضية</label>
        <textarea id="fSpecs" placeholder="الذاكرة، الرام، المعالج..."></textarea>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label>حالة الظهور بالكتالوج</label>
          <select id="fAvailable">
            <option value="true">متوفر (مرئي)</option>
            <option value="false">مخفي</option>
          </select>
        </div>
        <div class="form-group" style="display:flex; flex-direction:column; justify-content:center; gap:8px; padding-top:15px;">
          <label style="display:flex; align-items:center; gap:8px; font-size:12px; cursor:pointer; color:#fff; margin:0;">
            <input type="checkbox" id="fTradeIn"> يقبل المقايضة
          </label>
          <label style="display:flex; align-items:center; gap:8px; font-size:12px; cursor:pointer; color:#fff; margin:0;">
            <input type="checkbox" id="fFeatured"> توصية فقط (تأمين بالطلب)
          </label>
        </div>
      </div>

      <div class="form-group">
        <label>صورة الجهاز الأساسية (اختياري عند التعديل)</label>
        <label for="fImage" class="upload-box">📷 اختيار صورة من الجوال</label>
        <input type="file" id="fImage" accept="image/*" style="display:none;" onchange="previewImg(this, 'fPreview')">
        <img id="fPreview" class="img-preview" alt="معاينة">
      </div>

      <!-- قسم الخيارات المتغيرة (النسخ الديناميكية) -->
      <div class="form-group" style="margin-top: 20px; border-top: 1px solid var(--border); padding-top: 15px;">
        <label style="color: var(--primary); font-size: 1rem;">النسخ المتوفرة (ألوان، مساحات، إلخ)</label>
        <p style="font-size: 0.75rem; color: var(--muted); margin-bottom: 10px;">
          أضف النسخ المختلفة لهذا الجهاز. كل نسخة يمكن أن يكون لها سعر وصورة خاصة. (اختياري)
        </p>
        
        <div id="variantsContainer" style="display: flex; flex-direction: column; gap: 12px;"></div>
        
        <button type="button" onclick="addVariantBlock()" class="variant-add-btn">
          ➕ إضافة نسخة / خيار جديد
        </button>
      </div>

      <div class="action-buttons">
        <button type="submit" id="dSubmitBtn" class="submit-btn">حفظ الجهاز</button>
        <button type="button" id="dDeleteBtn" class="delete-btn hidden" onclick="deleteDevice()">🗑️ حذف</button>
      </div>
      
      <div id="dStatus" class="status"></div>
    </form>
  </div>

  <!-- قسم العروض -->
  <div id="offersSection" class="card hidden">
    <div class="sub-mode">
      <button id="oModeAdd" class="active" onclick="setOfferMode('add')">➕ إضافة عرض جديد</button>
      <button id="oModeEdit" onclick="setOfferMode('edit')">✏️ تعديل / حذف</button>
    </div>

    <form id="offerForm" onsubmit="saveOffer(event)">
      <!-- مجموعة اختيار العرض للتعديل -->
      <div id="selectOfferGroup" class="form-group hidden" style="background: var(--input-bg); padding: 10px; border-radius: 8px; border: 1px solid var(--border);">
        <label>ابحث واختر العرض:</label>
        <input type="text" id="searchEditOffer" placeholder="🔍 اكتب اسم العرض للبحث..." class="input-box" style="margin-bottom:8px;" onkeyup="filterEditOffers()">
        <select id="editOfferSelect" onchange="loadOfferData()">
          <option value="">-- جاري التحميل... --</option>
        </select>
      </div>

      <div class="form-group">
        <label>عنوان العرض (يظهر على الصورة)</label>
        <input type="text" id="oTitle" placeholder="عرض خاص، خصم نهاية الأسبوع...">
      </div>

      <div class="form-group">
        <label>ربط العرض بجهاز (ليتم حجزه مباشرة عند النقر)</label>
        <select id="oDevice">
          <option value="">بدون ربط (عرض صورة ووصف فقط)</option>
        </select>
      </div>

      <div class="form-group">
        <label>وصف العرض (في حال عدم الربط)</label>
        <textarea id="oDescription" placeholder="تفاصيل الخصم أو البكج..."></textarea>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label>ترتيب الظهور (الأقل يظهر أولاً)</label>
          <input type="number" id="oSortOrder" value="0">
        </div>
        <div class="form-group">
          <label>حالة الظهور بالسلايدر</label>
          <select id="oActive">
            <option value="true">فعّال (يظهر)</option>
            <option value="false">متوقف (مخفي)</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>صورة السلايدر</label>
        <label for="oImage" class="upload-box">📷 اختيار صورة العرض</label>
        <input type="file" id="oImage" accept="image/*" style="display:none;" onchange="previewImg(this, 'oPreview')">
        <img id="oPreview" class="img-preview" alt="معاينة">
      </div>

      <div class="action-buttons">
        <button type="submit" id="oSubmitBtn" class="submit-btn">حفظ العرض</button>
        <button type="button" id="oDeleteBtn" class="delete-btn hidden" onclick="deleteOffer()">🗑️ حذف</button>
      </div>

      <div id="oStatus" class="status"></div>
    </form>
  </div>
</div>

<script>
  // ==== إعدادات Supabase ====
  const SUPABASE_URL = "https://sbtbkfarxapuxkmgwepw.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNidGJrZmFyeGFwdXhrbWd3ZXB3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0MzE1MzIsImV4cCI6MjEwNTAwNzUzMn0.p9Mz-anhx5GweB7bNtApVjDXra6OjagDC9Jh9DaUdms";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let allDevices = [];
  let allOffers = [];
  let currentDeviceMode = 'add';
  let currentOfferMode = 'add';

  // معاينة الصورة
  function previewImg(input, previewId) {
    if (input.files && input.files[0]) {
      const img = document.getElementById(previewId);
      img.src = URL.createObjectURL(input.files[0]);
      img.style.display = 'block';
    }
  }

  // معاينة صورة الخيار (النسخة)
  function previewVariantImg(input) {
    if (input.files && input.files[0]) {
      let img = input.parentElement.querySelector('img');
      if (!img) {
        img = document.createElement('img');
        img.style = "width: 40px; height: 40px; object-fit: cover; border-radius: 4px; margin-top: 5px;";
        input.parentElement.appendChild(img);
      }
      img.src = URL.createObjectURL(input.files[0]);
    }
  }

  // ---------- المصادقة ----------
  async function handleLogin(e) {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const btn = document.getElementById('loginBtn');
    const err = document.getElementById('loginError');
    
    btn.disabled = true; err.textContent = 'جاري التحقق... ⏳';
    
    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
    btn.disabled = false;
    
    if (error) { err.textContent = 'البيانات غير صحيحة ❌'; } 
    else { err.textContent = ''; enterApp(); }
  }

  async function logout() {
    await supabaseClient.auth.signOut();
    document.getElementById('adminContent').classList.add('hidden');
    document.getElementById('lockScreen').classList.remove('hidden');
  }

  function enterApp() {
    document.getElementById('lockScreen').classList.add('hidden');
    document.getElementById('adminContent').classList.remove('hidden');
    loadAllData();
  }

  supabaseClient.auth.getSession().then(({ data }) => { if (data.session) enterApp(); });

  // ---------- التنقل والواجهة ----------
  function switchMainTab(tab) {
    const tabs = document.querySelectorAll('.tab-btn');
    tabs[0].classList.toggle('active', tab === 'devices');
    tabs[1].classList.toggle('active', tab === 'offers');

    document.getElementById('devicesSection').classList.toggle('hidden', tab !== 'devices');
    document.getElementById('offersSection').classList.toggle('hidden', tab !== 'offers');
  }

  function setDeviceMode(mode) {
    currentDeviceMode = mode;
    document.getElementById('dModeAdd').classList.toggle('active', mode === 'add');
    document.getElementById('dModeEdit').classList.toggle('active', mode === 'edit');
    document.getElementById('selectDeviceGroup').classList.toggle('hidden', mode === 'add');
    
    // إظهار/إخفاء زر الحذف
    document.getElementById('dDeleteBtn').classList.toggle('hidden', mode === 'add');
    
    document.getElementById('deviceForm').reset();
    document.getElementById('fPreview').style.display = 'none';
    document.getElementById('dStatus').textContent = '';
    
    // تفريغ حاوية النسخ
    document.getElementById('variantsContainer').innerHTML = '';

    if (mode === 'edit') {
      document.getElementById('searchEditDevice').value = '';
      populateDeviceEditDropdown();
    }
  }

  function setOfferMode(mode) {
    currentOfferMode = mode;
    document.getElementById('oModeAdd').classList.toggle('active', mode === 'add');
    document.getElementById('oModeEdit').classList.toggle('active', mode === 'edit');
    document.getElementById('selectOfferGroup').classList.toggle('hidden', mode === 'add');
    document.getElementById('oDeleteBtn').classList.toggle('hidden', mode === 'add');
    document.getElementById('offerForm').reset();
    document.getElementById('oPreview').style.display = 'none';
    document.getElementById('oStatus').textContent = '';
    
    if (mode === 'edit') {
      document.getElementById('searchEditOffer').value = '';
      populateOfferEditDropdown();
    }
  }

  // ---------- دالة إضافة كتل النسخ (Variants) ----------
  function addVariantBlock(variantData = null) {
    const container = document.getElementById('variantsContainer');
    const div = document.createElement('div');
    div.className = 'variant-block';
    
    const colorVal = variantData && variantData.color ? variantData.color : '';
    const specsVal = variantData && variantData.specs ? variantData.specs : '';
    const priceVal = variantData && variantData.price !== undefined ? variantData.price : '';
    const imgUrlVal = variantData && variantData.image_url ? variantData.image_url : '';
    const imgPreview = imgUrlVal ? `<img src="${imgUrlVal}" style="width: 40px; height: 40px; object-fit: cover; border-radius: 4px; margin-top: 5px;">` : '';

    div.innerHTML = `
      <button type="button" onclick="this.parentElement.remove()" class="variant-del-btn">🗑️ حذف</button>
      <div class="grid-2" style="margin-top: 15px; margin-bottom: 10px;">
        <div>
          <label>اللون</label>
          <input type="text" class="v-color input-box" placeholder="أسود، أزرق..." value="${colorVal}" style="padding: 8px; margin: 0;">
        </div>
        <div>
          <label>الميزة (ذاكرة / رام...)</label>
          <input type="text" class="v-specs input-box" placeholder="256GB / 12GB RAM..." value="${specsVal}" style="padding: 8px; margin: 0;">
        </div>
      </div>
      <div class="grid-2">
        <div>
          <label>سعر هذه النسخة ($)</label>
          <input type="number" class="v-price input-box" placeholder="السعر" value="${priceVal}" style="padding: 8px; margin: 0;">
        </div>
        <div>
          <label>صورة الخيار (اختياري)</label>
          <input type="file" class="v-image-file" accept="image/*" style="font-size: 0.75rem; color: #fff; width: 100%;" onchange="previewVariantImg(this)">
          <input type="hidden" class="v-image-url" value="${imgUrlVal}">
          ${imgPreview}
        </div>
      </div>
    `;
    container.appendChild(div);
  }

  // ---------- جلب البيانات ----------
  async function loadAllData() {
    await Promise.all([loadDevices(), loadOffers()]);
    populateOfferDeviceLinks();
  }

  async function loadDevices() {
    const { data } = await supabaseClient.from('devices').select('*').order('created_at', { ascending: false });
    allDevices = data || [];
    if (currentDeviceMode === 'edit') populateDeviceEditDropdown();
    populateOfferDeviceLinks();
  }

  async function loadOffers() {
    const { data } = await supabaseClient.from('offers').select('*').order('sort_order', { ascending: true });
    allOffers = data || [];
    if (currentOfferMode === 'edit') populateOfferEditDropdown();
  }

  // ---------- القوائم المنسدلة للبحث ----------
  function populateDeviceEditDropdown(filterText = '') {
    const select = document.getElementById('editDeviceSelect');
    const filtered = allDevices.filter(d => 
      (d.brand + ' ' + d.model).toLowerCase().includes(filterText.toLowerCase())
    );
    select.innerHTML = '<option value="">-- اختر للتعديل --</option>' + 
      filtered.map(d => `<option value="${d.id}">${d.brand} ${d.model} ($${d.price})</option>`).join('');
  }

  function filterEditDevices() {
    populateDeviceEditDropdown(document.getElementById('searchEditDevice').value);
  }

  function populateOfferEditDropdown(filterText = '') {
    const select = document.getElementById('editOfferSelect');
    const filtered = allOffers.filter(o => 
      (o.title || 'عرض بدون عنوان').toLowerCase().includes(filterText.toLowerCase())
    );
    select.innerHTML = '<option value="">-- اختر للتعديل --</option>' + 
      filtered.map(o => `<option value="${o.id}">${o.title || 'عرض بدون عنوان'}</option>`).join('');
  }

  function filterEditOffers() {
    populateOfferEditDropdown(document.getElementById('searchEditOffer').value);
  }

  function populateOfferDeviceLinks() {
    const select = document.getElementById('oDevice');
    const current = select.value;
    select.innerHTML = '<option value="">بدون ربط (عرض صورة ووصف فقط)</option>' + 
      allDevices.map(d => `<option value="${d.id}">${d.brand} ${d.model}</option>`).join('');
    select.value = current;
  }

  // ---------- تعبئة الفورم عند الاختيار ----------
  function loadDeviceData() {
    const id = document.getElementById('editDeviceSelect').value;
    const d = allDevices.find(x => x.id === id);
    if (!d) { 
      document.getElementById('deviceForm').reset(); 
      document.getElementById('fPreview').style.display = 'none'; 
      document.getElementById('variantsContainer').innerHTML = '';
      return; 
    }
    
    document.getElementById('fBrand').value = d.brand || '';
    document.getElementById('fModel').value = d.model || '';
    document.getElementById('fCondition').value = d.condition || 'مستعمل';
    document.getElementById('fPrice').value = d.price || '';
    document.getElementById('fColor').value = d.color || '';
    document.getElementById('fSpecs').value = d.specs || '';
    document.getElementById('fAvailable').value = (d.available !== false).toString();
    document.getElementById('fTradeIn').checked = !!d.trade_in;
    document.getElementById('fFeatured').checked = !!d.featured;
    
    const preview = document.getElementById('fPreview');
    if (d.image_url) { preview.src = d.image_url; preview.style.display = 'block'; }
    else { preview.style.display = 'none'; }

    // رسم الخيارات (Variants)
    document.getElementById('variantsContainer').innerHTML = '';
    if (d.variations && Array.isArray(d.variations)) {
      d.variations.forEach(v => addVariantBlock(v));
    }
  }

  function loadOfferData() {
    const id = document.getElementById('editOfferSelect').value;
    const o = allOffers.find(x => x.id === id);
    if (!o) { document.getElementById('offerForm').reset(); document.getElementById('oPreview').style.display = 'none'; return; }

    document.getElementById('oTitle').value = o.title || '';
    document.getElementById('oDevice').value = o.device_id || '';
    document.getElementById('oDescription').value = o.description || '';
    document.getElementById('oSortOrder').value = o.sort_order || 0;
    document.getElementById('oActive').value = (o.active !== false).toString();
    
    const preview = document.getElementById('oPreview');
    if (o.image_url) { preview.src = o.image_url; preview.style.display = 'block'; }
    else { preview.style.display = 'none'; }
  }

  // ---------- الحفظ والإرسال (الأجهزة) ----------
  async function saveDevice(e) {
    e.preventDefault();
    if (currentDeviceMode === 'edit' && !document.getElementById('editDeviceSelect').value) {
      alert('يرجى اختيار جهاز لتعديله أولاً'); return;
    }

    const btn = document.getElementById('dSubmitBtn');
    const status = document.getElementById('dStatus');
    btn.disabled = true; status.style.color = '#fff'; status.textContent = 'جاري الحفظ... ⏳';

    const payload = {
      brand: document.getElementById('fBrand').value.trim(),
      model: document.getElementById('fModel').value.trim(),
      condition: document.getElementById('fCondition').value,
      price: parseFloat(document.getElementById('fPrice').value) || 0,
      color: document.getElementById('fColor').value.trim(),
      specs: document.getElementById('fSpecs').value.trim(),
      available: document.getElementById('fAvailable').value === 'true',
      trade_in: document.getElementById('fTradeIn').checked,
      featured: document.getElementById('fFeatured').checked
    };

    // معالجة الخيارات المتغيرة (النسخ)
    status.textContent = 'جاري معالجة الخيارات والصور الإضافية... ⏳';
    let variationsArray = [];
    const variantBlocks = document.querySelectorAll('.variant-block');
    
    for (let block of variantBlocks) {
      const color = block.querySelector('.v-color').value.trim();
      const specs = block.querySelector('.v-specs').value.trim();
      const price = parseFloat(block.querySelector('.v-price').value) || 0;
      let imageUrl = block.querySelector('.v-image-url').value;
      
      const fileInput = block.querySelector('.v-image-file');
      
      if (fileInput.files && fileInput.files[0]) {
        const file = fileInput.files[0];
        const path = `variants/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9.\-]/g, '_')}`;
        const { error: upErr } = await supabaseClient.storage.from('device-images').upload(path, file);
        if (!upErr) {
          const { data: pub } = supabaseClient.storage.from('device-images').getPublicUrl(path);
          imageUrl = pub.publicUrl;
        }
      }
      
      if (color || specs || price > 0) {
        variationsArray.push({ color: color, specs: specs, price: price, image_url: imageUrl });
      }
    }
    payload.variations = variationsArray;

    // رفع صورة الجهاز الأساسية
    const fileInputMain = document.getElementById('fImage');
    if (fileInputMain.files && fileInputMain.files[0]) {
      status.textContent = 'جاري رفع الصورة الأساسية... ☁️';
      const file = fileInputMain.files[0];
      const path = `devices/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9.\-]/g, '_')}`;
      const { error: upErr } = await supabaseClient.storage.from('device-images').upload(path, file);
      if (!upErr) {
        const { data: pub } = supabaseClient.storage.from('device-images').getPublicUrl(path);
        payload.image_url = pub.publicUrl;
      }
    }

    let error;
    if (currentDeviceMode === 'edit') {
      const id = document.getElementById('editDeviceSelect').value;
      ({ error } = await supabaseClient.from('devices').update(payload).eq('id', id));
    } else {
      ({ error } = await supabaseClient.from('devices').insert(payload));
    }

    btn.disabled = false;
    if (error) { status.style.color = 'var(--danger)'; status.textContent = '❌ حدث خطأ أثناء الحفظ'; return; }
    
    status.style.color = 'var(--success)'; status.textContent = '✅ تم الحفظ بنجاح';
    
    if (currentDeviceMode === 'add') {
      document.getElementById('deviceForm').reset();
      document.getElementById('fPreview').style.display = 'none';
      document.getElementById('variantsContainer').innerHTML = '';
    } else {
      document.getElementById('searchEditDevice').value = '';
    }
    
    await loadDevices();
    setTimeout(() => { status.textContent = ''; }, 3000);
  }

  // ---------- دالة حذف جهاز ----------
  async function deleteDevice() {
    const id = document.getElementById('editDeviceSelect').value;
    if (!id) { alert('يرجى اختيار جهاز لحذفه'); return; }
    if (!confirm('هل أنت متأكد أنك تريد حذف هذا الجهاز نهائياً؟')) return; 

    const btn = document.getElementById('dDeleteBtn');
    const submitBtn = document.getElementById('dSubmitBtn');
    const status = document.getElementById('dStatus');
    
    btn.disabled = true; submitBtn.disabled = true;
    status.style.color = '#fff'; status.textContent = 'جاري الحذف... ⏳';

    const { error } = await supabaseClient.from('devices').delete().eq('id', id);

    btn.disabled = false; submitBtn.disabled = false;

    if (error) { status.style.color = 'var(--danger)'; status.textContent = '❌ حدث خطأ أثناء الحذف'; return; }
    
    status.style.color = 'var(--success)'; status.textContent = '✅ تم الحذف بنجاح';
    
    document.getElementById('deviceForm').reset();
    document.getElementById('fPreview').style.display = 'none';
    document.getElementById('variantsContainer').innerHTML = '';
    document.getElementById('searchEditDevice').value = '';
    
    await loadDevices();
    setTimeout(() => { status.textContent = ''; }, 3000);
  }

  // ---------- الحفظ والإرسال (العروض) ----------
  async function saveOffer(e) {
    e.preventDefault();
    if (currentOfferMode === 'edit' && !document.getElementById('editOfferSelect').value) {
      alert('يرجى اختيار عرض لتعديله أولاً'); return;
    }

    const btn = document.getElementById('oSubmitBtn');
    const status = document.getElementById('oStatus');
    btn.disabled = true; status.style.color = '#fff'; status.textContent = 'جاري الحفظ... ⏳';

    const payload = {
      title: document.getElementById('oTitle').value.trim() || null,
      device_id: document.getElementById('oDevice').value || null,
      description: document.getElementById('oDescription').value.trim() || null,
      sort_order: parseInt(document.getElementById('oSortOrder').value) || 0,
      active: document.getElementById('oActive').value === 'true'
    };

    const fileInput = document.getElementById('oImage');
    if (fileInput.files && fileInput.files[0]) {
      status.textContent = 'جاري رفع الصورة... ☁️';
      const file = fileInput.files[0];
      const path = `offers/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9.\-]/g, '_')}`;
      
      const { error: upErr } = await supabaseClient.storage.from('device-images').upload(path, file);
      if (upErr) {
        btn.disabled = false; status.style.color = 'var(--danger)'; status.textContent = '❌ فشل رفع الصورة'; return; 
      }
      const { data: pub } = supabaseClient.storage.from('device-images').getPublicUrl(path);
      payload.image_url = pub.publicUrl;
      
    } else if (currentOfferMode === 'add') {
      btn.disabled = false; status.style.color = 'var(--danger)'; status.textContent = '❌ صورة العرض مطلوبة'; return;
    }

    let error;
    if (currentOfferMode === 'edit') {
      const id = document.getElementById('editOfferSelect').value;
      ({ error } = await supabaseClient.from('offers').update(payload).eq('id', id));
    } else {
      ({ error } = await supabaseClient.from('offers').insert(payload));
    }

    btn.disabled = false;
    if (error) { status.style.color = 'var(--danger)'; status.textContent = '❌ حدث خطأ أثناء الحفظ'; return; }
    
    status.style.color = 'var(--success)'; status.textContent = '✅ تم الحفظ بنجاح';
    
    if (currentOfferMode === 'add') {
      document.getElementById('offerForm').reset();
      document.getElementById('oPreview').style.display = 'none';
    } else {
      document.getElementById('searchEditOffer').value = '';
    }
    
    await loadOffers();
    setTimeout(() => { status.textContent = ''; }, 3000);
  }

  async function deleteOffer() {
    const id = document.getElementById('editOfferSelect').value;
    if (!id) { alert('يرجى اختيار عرض لحذفه'); return; }
    if (!confirm('هل أنت متأكد أنك تريد حذف هذا العرض نهائياً؟')) return; 

    const btn = document.getElementById('oDeleteBtn');
    const submitBtn = document.getElementById('oSubmitBtn');
    const status = document.getElementById('oStatus');
    
    btn.disabled = true; submitBtn.disabled = true;
    status.style.color = '#fff'; status.textContent = 'جاري الحذف... ⏳';

    const { error } = await supabaseClient.from('offers').delete().eq('id', id);
    btn.disabled = false; submitBtn.disabled = false;

    if (error) { status.style.color = 'var(--danger)'; status.textContent = '❌ حدث خطأ أثناء الحذف'; return; }
    
    status.style.color = 'var(--success)'; status.textContent = '✅ تم الحذف بنجاح';
    
    document.getElementById('offerForm').reset();
    document.getElementById('oPreview').style.display = 'none';
    document.getElementById('searchEditOffer').value = '';
    
    await loadOffers();
    setTimeout(() => { status.textContent = ''; }, 3000);
  }
</script>
